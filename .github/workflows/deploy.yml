name: Deploy AR Tracker Pro to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Build Vite SPA
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Metode 1: GitHub Actions Native Deployment (Bila Source di Settings > Pages adalah 'GitHub Actions')
      - name: Deploy to GitHub Pages (GitHub Actions Source)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Metode 2: Fallback ke branch gh-pages otomatis jika Source di repositori masih default ('Deploy from a branch')
      - name: Fallback Deploy to gh-pages branch
        if: steps.deployment.outcome != 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
